spring.application.name=chat-service
server.port=8085

# PostgreSQL
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/chat_db
spring.datasource.username=postgres
spring.datasource.password=ABDO0505
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Multipart
spring.servlet.multipart.enabled=true

# Eureka
eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka
eureka.instance.prefer-ip-address=true

# Incident service URL (used by Feign client fallback)
incident.service.url=http://service-incident:8082

# Chatbot
chat.bot.name=Assistant IT

# Keycloak resource server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/incidents-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/incidents-realm/protocol/openid-connect/certs

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.gestion.incidents=DEBUG
logging.level.org.springframework.web.socket=INFO
