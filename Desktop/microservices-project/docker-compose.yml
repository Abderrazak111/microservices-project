version: '3.8'

services:

  # ============================================================
  # INFRASTRUCTURE — MinIO (Object Storage for Screenshots)
  # ============================================================

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD: MINIO_ROOT_PASSWORD
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console  →  http://localhost:9001
    volumes:
      - minio_data:/data
    networks:
      - incidents-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO bucket initialisation (runs once, then exits)
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - incidents-network
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/incidents;
        mc mb --ignore-existing local/commentaires-pieces-jointes;
        mc policy set public local/incidents;
        echo 'MinIO buckets ready.';
      "

  # ============================================================
  # INFRASTRUCTURE — Keycloak (Identity & Access Management)
  # ============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: KEYCLOAK_DB_PASSWORD
      KEYCLOAK_ADMIN: KEYCLOAK_ADMIN
      KEYCLOAK_ADMIN_PASSWORD: KEYCLOAK_ADMIN_PASSWORD
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"   # Keycloak UI  →  http://localhost:8080
    volumes:
      - ./keycloak/incidents-realm.json:/opt/keycloak/data/import/incidents-realm.json
    networks:
      - incidents-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  # ============================================================
  # PLATFORM — Eureka Service Discovery
  # ============================================================

  eureka-service:
    build:
      context: ./services/eureka-service
      dockerfile: Dockerfile
    container_name: eureka-service
    ports:
      - "8761:8761"   # Eureka Dashboard  →  http://localhost:8761
    environment:
      SPRING_APPLICATION_NAME: eureka-service
      SERVER_PORT: 8761
    networks:
      - incidents-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ============================================================
  # PLATFORM — Config Server (reads from GitHub config-repo)
  # ============================================================

  config-server:
    build:
      context: ./services/config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_APPLICATION_NAME: config-server
      SERVER_PORT: 8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka
    depends_on:
      eureka-service:
        condition: service_healthy
    networks:
      - incidents-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ============================================================
  # BUSINESS — Service Incident
  # ============================================================

  service-incident:
    build:
      context: ./services/service-incident
      dockerfile: Dockerfile
    container_name: service-incident
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: service-incident
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_ENABLED: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/incidents_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: INCIDENT_DB_PASSWORD
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: incidents
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/incidents-realm
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka
    depends_on:
      config-server:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    networks:
      - incidents-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ============================================================
  # BUSINESS — Service User
  # ============================================================

  service-user:
    build:
      context: ./services/service-user
      dockerfile: Dockerfile
    container_name: service-user
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: service-user
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_ENABLED: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/service_user_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: USER_DB_PASSWORD
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/incidents-realm
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka
    depends_on:
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - incidents-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ============================================================
  # BUSINESS — Comment Service
  # ============================================================

  comment-service:
    build:
      context: ./services/comment-service
      dockerfile: Dockerfile
    container_name: comment-service
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: comment-service
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/comment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: COMMENT_DB_PASSWORD
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/incidents-realm
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka
    depends_on:
      config-server:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    networks:
      - incidents-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ============================================================
  # BUSINESS — Chat Service
  # ============================================================

  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    container_name: chat-service
    ports:
      - "8085:8085"
    environment:
      SPRING_APPLICATION_NAME: chat-service
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/chat_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: CHAT_DB_PASSWORD
      INCIDENT_SERVICE_URL: http://service-incident:8082
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/incidents-realm
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - incidents-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ============================================================
  # EDGE — API Gateway
  # ============================================================

  gateway-service:
    build:
      context: ./services/gateway_service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8880:8880"   # Main entry point  →  http://localhost:8880
    environment:
      SPRING_APPLICATION_NAME: gateway_service
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_ENABLED: "true"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/incidents-realm
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka
    depends_on:
      config-server:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - incidents-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8880/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s


volumes:
  minio_data:

# ============================================================
# NETWORK
# ============================================================

networks:
  incidents-network:
    name: incidents-network
    driver: bridge
